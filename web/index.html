<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Review dashboard</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("review-dashboard-theme")
          const dark = stored === "dark" || (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.add(dark ? "dark" : "light")
          document.documentElement.style.backgroundColor = dark ? "#0a0a0c" : "#fafafa"
        } catch {
          // React applies the theme after startup if storage is unavailable.
        }
      })()
    </script>
  </head>
  <body>
    <script id="dashboard-data" type="application/json">null</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
